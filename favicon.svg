  <style>.nvy-s{stroke:#1e3a8a}.nvy-f{fill:#1e3a8a}@media (prefers-color-scheme:dark){.nvy-s{stroke:#ffffff}.nvy-f{fill:#ffffff}}</style>
  <!-- vòng badge: copy shape từ iai-question-bank (2 cung hở, bo tròn). Class chỉ đặt stroke để KHÔNG đè fill="none" -->
