  <path d="M 113.6 118.5 A 198 198 0 0 0 169.2 434.0" fill="none" stroke="#84b026" stroke-width="46" stroke-linecap="round"/>
  <!-- mũ tốt nghiệp (thay cho dấu tick), phóng to ~1.3×. Class chỉ đặt fill -->
